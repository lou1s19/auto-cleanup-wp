name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Niedrigste unterstuetzte Version, aktuelle Version und die naechste,
        # damit neue Deprecations auffallen, bevor sie auf Kundenservern landen.
        php: ['7.4', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Alle PHP-Dateien linten
        run: |
          set -e
          find . -path ./vendor -prune -o -name '*.php' -print \
            | xargs -n1 -P4 php -l

      - name: Tests
        # Deprecations und Notices zaehlen als Fehler, sonst rutschen sie durch.
        run: php -d error_reporting=E_ALL -d display_errors=1 tests/run.php

  meta:
    name: Version und Header
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Plugin-Header und Konstante muessen dieselbe Version haben
        run: |
          set -e
          header=$(grep -m1 '^ \* Version:' auto-setup.php | sed 's/.*Version:[[:space:]]*//')
          changelog=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## \([0-9.]*\).*/\1/')
          echo "Plugin-Header: $header"
          echo "Changelog:     $changelog"
          if [ "$header" != "$changelog" ]; then
            echo "Version im Plugin-Header und im Changelog laufen auseinander." >&2
            exit 1
          fi
